<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChangePath – Proof of work for AI-fluent talent</title>
<meta name="description" content="With ChangePath, you stand out from generic AI-generated applications with real work samples built from real job postings. Join the waitlist for free.">
<meta property="og:title" content="ChangePath – To be visible, you need more than an AI generated CV">
<meta property="og:description" content="Real work samples built from real job postings, for AI-fluent professionals outside of tech. Join the waitlist for free.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0F0F4C">
<link rel="icon" href="assets/shapes.png">
<link rel="preload" href="fonts/GalanoClassic-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/SplineSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="icons.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav">
  <div class="nav-in">
    <a href="#top" class="nav-logo"><img src="assets/logo.png" alt="ChangePath" width="85" height="30"></a>
    <nav class="nav-links">
      <a href="#vision" data-t="navVision">Vision</a>
      <a href="#functions" data-t="navFunctions">Functions</a>
      <a href="#how" data-t="navHow">How it works</a>
      <a href="#proof" data-t="navProof">Proof</a>
      <a href="#faq" data-t="navFaq">FAQ</a>
    </nav>
    <div class="nav-right">
      <div class="lang">
        <button type="button" data-lang="en" aria-label="English">EN</button>
        <span>/</span>
        <button type="button" data-lang="de" aria-label="Deutsch">DE</button>
      </div>
      <a href="#waitlist" class="btn btn-sm btn-primary" data-t="navCta">Join the waitlist</a>
    </div>
  </div>
</header>

<main>
<section id="top" class="hero">
  <div class="wrap hero-in">
    <div class="hero-copy">
      <div class="hero-kicker" data-t="heroKicker" data-show="talent"></div>
      <h1 class="hero-h1">
        <span data-t="heroA1">To be visible, you need more than an</span>
        <span class="grad-text hero-grad" data-t="heroA2">AI generated CV</span>
      </h1>
      <p class="hero-sub" data-t="heroSub"></p>
      <div class="btn-row">
        <a href="#waitlist" class="btn btn-lg btn-white"><span data-t="ctaPrimary">Join the waitlist</span> <i class="ph-bold ph-arrow-right"></i></a>
      </div>
    </div>

    <div class="pile" aria-hidden="true">
      <div class="pile-tag"><i class="ph-bold ph-stack"></i><span data-t="pileTag"></span></div>
      <div class="cv cv1"><div class="bar" style="width:46%"></div><div class="cv-text" data-t="cliche"></div></div>
      <div class="cv cv2"><div class="bar" style="width:38%"></div><div class="cv-text" data-t="cliche"></div></div>
      <div class="cv cv3"><div class="bar" style="width:52%"></div><div class="cv-text" data-t="cliche"></div></div>
      <div class="cv cv4">
        <div class="cv-head"><div class="bar" style="width:44%;margin:0"></div><div class="cv-pdf">CV.PDF</div></div>
        <div class="cv-text" data-t="cliche"></div>
        <div class="cv-lines"><div></div><div style="width:80%"></div></div>
      </div>
      <div class="proof-card">
        <div class="proof-card-in">
          <img src="assets/shapes.png" alt="" class="proof-card-shape">
          <div class="chips">
            <span class="pill pill-grad" data-t="badgeProof">PROOF OF WORK</span>
            <span class="pill pill-soft" data-t="pileFn"></span>
          </div>
          <div class="proof-card-title" data-t="pileTitle"></div>
          <div class="proof-card-who" data-t="pileWho"></div>
          <div class="thumbs"><div></div><div></div><div></div></div>
          <div class="proof-card-meta"><i class="ph-bold ph-eye"></i><span data-t="pileMeta"></span></div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap pad stack-56">
    <div class="stats-head">
      <div class="label" data-t="statsLabel"></div>
      <h2 class="h2-xl" data-t="statsTitle"></h2>
    </div>
    <div class="stats" data-list="stats"></div>
    <figure class="quote">
      <div class="quote-mark">“</div>
      <div class="stack-16">
        <blockquote data-t="quote"></blockquote>
        <figcaption data-t="quoteBy"></figcaption>
      </div>
    </figure>
  </div>
</section>

<section id="compare" class="sec sec-grey">
  <div class="wrap cmp-in">
    <div class="stack-18">
      <div class="label" data-t="cmpLabel"></div>
      <h2 class="cmp-title" data-t="cmpTitle"></h2>
    </div>
    <div class="cmp-grid">
      <div class="cmp-old">
        <div class="cmp-head"><span class="cmp-icon"><i class="ph-bold ph-file-text"></i></span><div class="cmp-h" data-t="cmpOldTitle"></div></div>
        <div class="cmp-list" data-list="cmpOld"></div>
      </div>
      <div class="cmp-new">
        <div class="cmp-new-in">
          <img src="assets/shapes.png" alt="" class="cmp-shape">
          <div class="cmp-head"><span class="cmp-icon"><i class="ph-bold ph-seal-check"></i></span><div class="cmp-h" data-t="cmpNewTitle"></div></div>
          <div class="cmp-list" data-list="cmpNew"></div>
        </div>
      </div>
    </div>
    <div class="center"><a href="#waitlist" class="btn btn-xl btn-primary"><span data-t="navCta"></span> <i class="ph-bold ph-arrow-right"></i></a></div>
  </div>
</section>

<section class="sec" data-show="employers">
  <figure class="rec">
    <blockquote data-t="recQuote"></blockquote>
    <figcaption data-t="recBy"></figcaption>
  </figure>
</section>

<section id="functions" class="sec sec-lav">
  <div class="wrap pad stack-56">
    <div class="fn-head">
      <div class="label fn-label" data-t="fnLabel"></div>
      <h2 class="h2-xl"><span data-t="fnTitle1"></span><span data-t="fnTitle2"></span></h2>
      <p class="lead" data-t="fnSub"></p>
    </div>
    <div class="carousel">
      <div class="fn-grid" data-list="functions" aria-live="polite"></div>
      <div class="car-foot">
        <div class="car-left">
          <div class="car-dots" data-list="fnDots"></div>
          <span class="car-more" data-t="fnMore"></span>
        </div>
        <div class="car-arrows">
          <button type="button" class="car-btn car-prev" aria-label="Previous"><i class="ph-bold ph-arrow-left"></i></button>
          <button type="button" class="car-btn car-next" aria-label="Next"><i class="ph-bold ph-arrow-right"></i></button>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="how" class="sec">
  <div class="wrap pad how-in">
    <div class="how-head">
      <div class="label" data-t="howLabel"></div>
      <h2 class="h2-xl" data-t="howTitle"></h2>
    </div>
    <div class="steps" data-list="steps"></div>
    <div class="center"><a href="#waitlist" class="btn btn-xl btn-primary"><span data-t="navCta"></span> <i class="ph-bold ph-arrow-right"></i></a></div>
  </div>
</section>

<section id="waitlist" class="sec sec-dark waitlist">
  <img src="assets/shapes.png" alt="" class="waitlist-shape">
  <div class="wrap pad waitlist-in">
    <div class="stack-24">
      <div class="label label-peach" data-t="formLabel"></div>
      <h2 class="waitlist-title" data-t="formTitle"></h2>
      <p class="waitlist-sub" data-t="formSub"></p>
      <p class="waitlist-sub" data-t="formSub2"></p>
    </div>
    <div class="form-card">
      <div data-form="waitlist" data-cta="formCta" data-fine="formFine"></div>
      <div class="done" data-done hidden>
        <div class="done-check"><i class="ph-bold ph-check"></i></div>
        <div class="done-title" data-t="doneTitle"></div>
        <p class="done-body" data-t="doneBody"></p>
      </div>
    </div>
  </div>
</section>

<section id="vision" class="sec">
  <div class="wrap pad vision-in">
    <div class="vision-head">
      <div class="label" data-t="visionLabel">Our vision</div>
      <h2 class="vision-title" data-t="visionTitle"></h2>
      <p class="vision-intro" data-t="visionIntro"></p>
    </div>
    <div class="vision-list" data-list="vision"></div>
  </div>
</section>

<section id="faq" class="sec sec-grey">
  <div class="wrap pad faq-in">
    <div class="stack-18">
      <div class="label">FAQ</div>
      <h2 class="faq-title" data-t="faqTitle"></h2>
    </div>
    <div class="faq-list" data-list="faq"></div>
  </div>
</section>

<section id="proof" class="sec sec-lav">
  <div class="wrap proof-in">
    <div class="proof-head">
      <div class="stack-18">
        <div class="label" data-t="proofLabel"></div>
        <h2 class="proof-title" data-t="proofTitle"></h2>
      </div>
      <p class="proof-sub" data-t="proofSub"></p>
    </div>

    <div class="beta">
      <div class="beta-bg" aria-hidden="true">
        <div class="mock">
          <div class="mock-bar">
            <div class="dots"><span></span><span></span><span></span></div>
            <div class="mock-url"><i class="ph-bold ph-lock-simple"></i>changepath.ai/proof/lena-w/ai-marketing-ops</div>
          </div>
          <div class="mock-body">
            <div class="mock-person">
              <div class="avatar">LW</div>
              <div class="mock-name">Lena W.</div>
              <div class="mock-from"><span data-t="mockFrom"></span> <i class="ph-bold ph-arrow-right"></i> <b data-t="mockTo"></b></div>
              <div class="chips"><span class="pill pill-grad" data-t="mockMatch"></span><span class="pill pill-grey">BERLIN · EN/DE</span></div>
              <div class="mock-for" data-t="mockFor"></div>
            </div>
            <div class="mock-main">
              <div data-list="mockBlocks" class="mock-blocks"></div>
              <div class="mock-artifacts" data-list="mockArtifacts"></div>
            </div>
          </div>
          <div class="mock-foot">
            <div class="mock-read"><i class="ph-bold ph-clock"></i><span data-t="mockRead"></span></div>
            <div class="mock-opened" data-show="talent"><i class="ph-bold ph-eye"></i><span data-t="mockOpened"></span></div>
            <div class="mock-actions" data-show="employers"><span class="mock-pass" data-t="mockPass"></span><span class="mock-invite"><i class="ph-bold ph-calendar-check"></i><span data-t="mockInvite"></span></span></div>
          </div>
        </div>
        <div class="minis">
          <div class="minis-list" data-list="miniProofs"></div>
          <div class="pitch"><img src="assets/shapes.png" alt=""><div data-t="pitchLine"></div></div>
        </div>
      </div>
      <div class="beta-card-wrap">
        <div class="beta-form-card">
          <div class="stack-10">
            <span class="pill pill-grad beta-pill"><i class="ph-bold ph-lock-simple"></i><span data-t="betaBadge"></span></span>
            <div class="beta-title" data-t="betaTitle"></div>
          </div>
          <div data-form="beta" data-cta="betaCta" data-fine="betaFine"></div>
          <div class="beta-done" data-done hidden>
            <span class="li-icon beta-done-icon"><i class="ph-bold ph-check"></i></span>
            <div class="stack-6">
              <div class="li-title" data-t="doneTitle"></div>
              <p class="up-body" data-t="doneBody"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</main>

<footer class="footer">
  <div class="wrap footer-in">
    <div class="footer-brand"><span>ChangePath</span><span>©2026</span></div>
    <div class="footer-links">
      <a href="#top" id="switch-audience" class="footer-switch"></a>
      <a href="https://www.linkedin.com/in/maritzabonano/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://www.changepath.ai/impressum" target="_blank" rel="noopener" data-t="imprint">Imprint</a>
      <a href="https://www.changepath.ai/datenschutz" target="_blank" rel="noopener" data-t="privacy">Privacy</a>
    </div>
  </div>
</footer>

<!-- Sign-up form, used by both #waitlist and #proof. -->
<template id="signup-tpl">
  <form class="form signup" novalidate>
    <div class="form-fields" data-fields></div>
    <div class="chip-group" data-show="talent">
      <span class="field-label" data-t="chipLabel"></span>
      <div class="fn-chips" data-chips></div>
      <input type="text" name="otherFunction" class="input" hidden maxlength="120">
    </div>
    <input type="text" name="cp_extra" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label class="consent">
      <input type="checkbox" name="consent" required>
      <span><span data-t="consentPre"></span><a href="https://www.changepath.ai/datenschutz" target="_blank" rel="noopener" data-t="consentLink"></a><span data-t="consentPost"></span></span>
    </label>
    <p class="form-error" role="alert" hidden></p>
    <button type="submit" class="btn btn-submit"><span data-cta></span> <i class="ph-bold ph-arrow-right"></i></button>
    <div class="form-fine" data-fine></div>
  </form>
</template>

<script src="copy.js"></script>
<script src="app.js"></script>
</body>
</html>
